# =============================================================================
# 20-Week Pyramidal FTP Build — encoded from your plan.
#
# Periodized into 4 phases. A date resolves to a workout by:
#   1. an exact-date entry under `schedule:` (FTP tests) — highest priority
#   2. the phase whose week range contains that date -> that phase's weekday
#
# Watt targets below are anchored to FTP 305 (8/04 ramp retest). RE-ANCHOR after each retest:
# update `ftp` in config/athlete.yaml and bump the watt targets in the affected
# phase (or just ask Claude via /training-review to re-anchor them).
#
# Workout fields: type, duration_min, target_watts, target_if, target_tss, description
# Types used: Rest, Recovery, Endurance, SweetSpot, Threshold, VO2max, Test
# =============================================================================

meta:
  name: "20-Week Pyramidal FTP Build"
  goal: "Raise FTP from 315; crit specificity by peak"
  start_date: 2026-06-15        # Monday of Week 1 (you started Tue 6/16)
  ftp_at_start: 315

phases:
  # -------------------------------------------------------------------------
  - name: "Phase 1 — Aerobic Base"
    weeks: [1, 7]                  # was [1, 6]; extended +1wk after 7/16-7/26 gap so
                                   # the re-entry week (W7 = 7/27-8/02, encoded as per-day
                                   # schedule overrides below) sits before the retest on 8/04.
    week_template:
      monday:
        type: Recovery
        duration_min: 30
        target_watts: "<200"
        target_if: 0.50
        description: "Rest, or 30 min easy spin. Genuinely easy."
      tuesday:
        type: Endurance
        duration_min: 90
        target_watts: "200-230"
        target_if: 0.66
        target_tss: 65
        description: "Z2, 75-90 min. Conversational, cadence 90+."
      wednesday:
        type: SweetSpot
        duration_min: 75
        target_watts: "280-295"
        target_if: 0.74            # Calibrated for 2x15 @ 285W with proper WU/CD.
        target_tss: 65             # Bump to IF 0.78 / TSS 72 once you're built to 2x20.
        description: "WU 15min, SST 2x15min @ 285W (3 min easy between), CD. Build toward 2x20."
      thursday:
        type: Endurance
        duration_min: 75
        target_watts: "200-230"
        target_if: 0.65
        target_tss: 52
        description: "Z2, 60-90 min."
      friday:
        type: Rest
        description: "Full rest."
      saturday:
        type: Endurance
        duration_min: 180
        target_watts: "200-230"
        target_if: 0.66
        target_tss: 130
        description: "Long Z2, 2.5-3.5 hr. Biggest aerobic stimulus of the week — fuel well."
      sunday:
        type: Endurance
        duration_min: 90
        target_watts: "Z2 200-230, tempo 240-285"
        target_if: 0.70
        target_tss: 72
        description: "Z2 90 min with 2x10 min tempo @ 240-285W in the back half."

  # -------------------------------------------------------------------------
  - name: "Phase 2 — Threshold Build"
    weeks: [8, 13]                 # was [7, 12]; shifted +1wk with Phase 1 extension.
    week_template:
      monday:
        type: Rest
        description: "Rest or easy spin."
      tuesday:
        type: Threshold
        duration_min: 75
        target_watts: "290-305"
        target_if: 0.85
        target_tss: 92
        description: "WU, Threshold reps @ ~100% FTP, CD. Progression as of 8/18 (session done): 8/18 held 2x20 @ 299W/HR 162 + 304W/HR 169, fade -1.7%, EF 1.801, ride max HR 177 vs 197 — the best threshold session on record and clearly submaximal. Next rung is TIME, not watts: 3x15 @ 305W (45 min work, 4 min easy between), since long-ride durability is the standing limiter. Fuel per the indoor-threshold rule (main meal 3h out, 60-90 g carb/hr + 500-800 mg sodium/hr on-bike, fan on)."
      wednesday:
        type: Endurance
        duration_min: 75
        target_watts: "195-225"
        target_if: 0.65
        target_tss: 52
        description: "Z2, 75 min."
      thursday:
        type: Threshold
        duration_min: 75
        target_watts: "under 280 / over 320"
        target_if: 0.88
        target_tss: 95
        description: "Over-unders: 2 sets of 4x(3 min under @280W / 2 min over @320W). Trains lactate shuttling. FUEL — non-negotiable after the 8/13 abort (cramp + stitch on water only, green Oura, ride max HR 178 vs 197): main meal ~3h out (~2 g/kg carb, low fat/low fibre), 60-90 g carb/hr + 500-800 mg sodium/hr on the bike, fan on. If set 2 fragments again WITH that fueling in place, it is a fitness ceiling and the overs drop to 310W."
      friday:
        type: Rest
        description: "Full rest."
      saturday:
        type: Endurance
        duration_min: 165
        target_watts: "Z2 195-225, tempo 230-275"
        target_if: 0.71
        target_tss: 135
        description: "Long endurance 2.5-3 hr with 3x12 min tempo @ 230-275W. The tempo blocks are the durability stimulus — ride them: 8/08 (VI 1.04) and 8/15 (VI 1.02) were both flat Z2 with no tempo detectable. Fuel it: 60-90 g carb/hr + 500-800 mg sodium/hr on the bike."
      sunday:
        type: Endurance
        duration_min: 90
        target_watts: "195-225"
        target_if: 0.65
        target_tss: 62
        description: "Z2, 90 min."

  # -------------------------------------------------------------------------
  - name: "Phase 3 — VO2max Block"
    weeks: [14, 17]                # was [13, 16]; shifted +1wk.
    week_template:
      monday:
        type: Rest
        description: "Rest."
      tuesday:
        type: VO2max
        duration_min: 60
        target_watts: "325-350"
        target_if: 0.88
        target_tss: 85
        description: "WU, 4x4 min @ 115% FTP (~350W) w/ 4 min easy between, CD."
      wednesday:
        type: Endurance
        duration_min: 60
        target_watts: "195-225"
        target_if: 0.63
        target_tss: 40
        description: "Easy Z2. Lower volume block — keep this genuinely easy."
      thursday:
        type: VO2max
        duration_min: 60
        target_watts: "345 / 195"
        target_if: 0.86
        target_tss: 80
        description: "30/15s: 30 sec @ 345W / 15 sec @ 195W x13, 2-3 sets."
      friday:
        type: Rest
        description: "Rest."
      saturday:
        type: Endurance
        duration_min: 165          # HELD at 165 on 8/18 (was 135) — the 8/13 log's pre-committed
                                   # rule fired: 8/15 long-ride decoupling came in at 8.0%, still
                                   # above the 6.0% flag and the 3rd straight Saturday over it
                                   # (7/12 6.2% -> 8/08 9.8% -> 8/15 8.0%). Durability is the
                                   # standing limiter, so the VO2 block does not get to shrink
                                   # the one session that treats it.
        target_watts: "195-225"
        target_if: 0.66
        target_tss: 120
        description: "Z2 endurance, 2.5-2.75 hr. Held at 165 min (not cut to 135) while long-ride decoupling stays >6% — this is the durability lever. Fuel it: 60-90 g carb/hr + 500-800 mg sodium/hr. Cut to 135 min once two consecutive long rides come in under 6%."
      sunday:
        type: Endurance
        duration_min: 75
        target_watts: "195-225"
        target_if: 0.63
        target_tss: 48
        description: "Easy Z2 or rest."

  # -------------------------------------------------------------------------
  - name: "Phase 4 — Consolidation + Peak"
    weeks: [18, 21]                # was [17, 20]; shifted +1wk.
    week_template:
      monday:
        type: Rest
        description: "Rest."
      tuesday:
        type: Threshold
        duration_min: 90
        target_watts: "98-100% FTP (re-anchor)"
        target_if: 0.86
        target_tss: 110
        description: "Threshold 2x25-30 min @ 98-100% FTP. Re-anchor to current FTP."
      wednesday:
        type: Endurance
        duration_min: 75
        target_watts: "195-225"
        target_if: 0.65
        target_tss: 52
        description: "Z2, 75 min."
      thursday:
        type: Threshold
        duration_min: 75
        target_watts: "under 280 / over 320+"
        target_if: 0.88
        target_tss: 95
        description: "Over-unders, longer overs."
      friday:
        type: Rest
        description: "Full rest."
      saturday:
        type: Endurance
        duration_min: 150
        target_watts: "Z2 + surges to race pace"
        target_if: 0.72
        target_tss: 120
        description: "Endurance with race-pace surges (crit specificity)."
      sunday:
        type: Endurance
        duration_min: 90
        target_watts: "195-225"
        target_if: 0.64
        target_tss: 58
        description: "Easy Z2."

# Date-specific overrides — highest priority per date. Used for tests and for the
# 7/26-8/02 re-entry ramp after the 11-day off-bike gap (7/16-7/26). Retest Tue 8/04.
schedule:
  # -------------------- Re-entry ramp (7/26 → 8/02) --------------------
  2026-07-26:                     # today — was Endurance 90 min w/ 2x10 tempo
    type: Endurance
    duration_min: 60
    target_watts: "200-230"
    target_if: 0.66
    target_tss: 44
    description: "Re-entry ride #1 after 11-day gap. Pure Z2, NO tempo blocks. If HR runs away at 210W or legs empty, cut to 45 min easy spin — don't force it."
  2026-07-27:                     # Mon — Rest (matches Phase 1 Mon but stated explicitly for the log)
    type: Rest
    description: "Rest between re-entry rides #1 and #2. 20-min easy spin is fine if legs feel stiff."
  2026-07-28:                     # was the FTP test date
    type: Endurance
    duration_min: 60
    target_watts: "200-230"
    target_if: 0.66
    target_tss: 44
    description: "Re-entry ride #2. Z2, cadence 90+. FTP retest pushed from today to 8/04 — do NOT test today."
  2026-07-29:                     # SST re-entry, stepped back from 2x20 @ 285W
    type: SweetSpot
    duration_min: 60
    target_watts: "270-280"
    target_if: 0.72
    target_tss: 52
    description: "Re-entry SST: WU 15min, 2x10 min @ 275W (~87% FTP, 3 min easy between), CD. If HR <162 at end of rep 1, take rep 2 to 12 min. Deliberately below the 2x20 @ 285W last done 7/15 — one clean step-back before rebuilding."
  2026-07-30:
    type: Endurance
    duration_min: 60
    target_watts: "200-230"
    target_if: 0.65
    target_tss: 42
    description: "Re-entry Z2, 60 min. Conversational."
  2026-07-31:
    type: Rest
    description: "Full rest."
  2026-08-01:                     # long ride re-entry — 120 min not 180
    type: Endurance
    duration_min: 120
    target_watts: "200-230"
    target_if: 0.66
    target_tss: 87
    description: "Long ride re-entry — 120 min Z2, NO tempo. Fuel well (60-90 g/hr on-bike, ~2 g/kg carbs in the 2 hr pre-ride). Was 180 min — stepped back by an hour."
  2026-08-02:
    type: Endurance
    duration_min: 60
    target_watts: "200-230"
    target_if: 0.65
    target_tss: 42
    description: "Easy Z2 close to re-entry week. Was 90 min w/ tempo — no tempo this week."

  # -------------------- Test day --------------------
  # Test is Tue 8/04, first Tuesday of the new Phase 2 window. One re-entry week
  # (7/27-8/02) is enough to re-sync HR-for-power pattern in a trained cyclist;
  # the underlying adaptations from Phase 1 didn't unwind in 10 days off.
  2026-08-04:                     # was 2026-07-28; pushed +1wk after the gap.
    type: Test
    description: "FTP retest (20-min test x0.95, or ramp). Pushed one week from 7/28 to allow a re-entry week (7/27-8/02) after the 11-day off-bike gap. Re-anchor watt targets after."
  2026-09-08:                     # ADDED 8/13. Mid-build retest at the end of Phase 2 (wk 13),
                                  # six days before the Phase 3 VO2 block opens on Mon 9/14.
    type: Test
    description: "FTP retest (20-min x0.95 preferred over ramp — ramp under-reads for this rider). Added because the 305 anchor looks stale: 8/11 held 2x(17/20min) @ 294W at HR 169/171 with 0.0% fade, and 8/13 held 20min @ 295W at HR 167 — vs the pre-gap 7/15 best of 2x20 @ 285W at HR 163/167. That is +10W at the same HR, i.e. threshold expression is now ABOVE pre-gap. Phase 3 watt targets (VO2 325-350W) are anchored to FTP, so testing before 9/14 keeps the VO2 block from running too easy. Re-anchor Phase 3/4 targets after."
  2026-11-03:                     # was 2026-10-27; final test shifted +1wk with the phases.
    type: Test
    description: "Final FTP test (20-min x0.95 or ramp). Converts the raised ceiling into testable FTP."
