# =============================================================================
# 20-Week Pyramidal FTP Build — encoded from your plan.
#
# Periodized into 4 phases. A date resolves to a workout by:
#   1. an exact-date entry under `schedule:` (FTP tests) — highest priority
#   2. the phase whose week range contains that date -> that phase's weekday
#
# Watt targets below are anchored to FTP 320 (8/25 ramp retest; was 305 from 8/04). RE-ANCHOR after each retest:
# update `ftp` in config/athlete.yaml and bump the watt targets in the affected
# phase (or just ask Claude via /training-review to re-anchor them).
#
# Workout fields: type, duration_min, target_watts, target_if, target_tss, description
# Types used: Rest, Recovery, Endurance, SweetSpot, Threshold, VO2max, Test
# =============================================================================

meta:
  name: "20-Week Pyramidal FTP Build"
  goal: "Raise FTP from 315; crit specificity by peak"
  start_date: 2026-06-15        # Monday of Week 1 (you started Tue 6/16)
  ftp_at_start: 315

phases:
  # -------------------------------------------------------------------------
  - name: "Phase 1 — Aerobic Base"
    weeks: [1, 7]                  # was [1, 6]; extended +1wk after 7/16-7/26 gap so
                                   # the re-entry week (W7 = 7/27-8/02, encoded as per-day
                                   # schedule overrides below) sits before the retest on 8/04.
    week_template:
      monday:
        type: Recovery
        duration_min: 30
        target_watts: "<200"
        target_if: 0.50
        description: "Rest, or 30 min easy spin. Genuinely easy."
      tuesday:
        type: Endurance
        duration_min: 90
        target_watts: "200-230"
        target_if: 0.66
        target_tss: 65
        description: "Z2, 75-90 min. Conversational, cadence 90+."
      wednesday:
        type: SweetSpot
        duration_min: 75
        target_watts: "280-295"
        target_if: 0.74            # Calibrated for 2x15 @ 285W with proper WU/CD.
        target_tss: 65             # Bump to IF 0.78 / TSS 72 once you're built to 2x20.
        description: "WU 15min, SST 2x15min @ 285W (3 min easy between), CD. Build toward 2x20."
      thursday:
        type: Endurance
        duration_min: 75
        target_watts: "200-230"
        target_if: 0.65
        target_tss: 52
        description: "Z2, 60-90 min."
      friday:
        type: Rest
        description: "Full rest."
      saturday:
        type: Endurance
        duration_min: 180
        target_watts: "200-230"
        target_if: 0.66
        target_tss: 130
        description: "Long Z2, 2.5-3.5 hr. Biggest aerobic stimulus of the week — fuel well."
      sunday:
        type: Endurance
        duration_min: 90
        target_watts: "Z2 200-230, tempo 240-285"
        target_if: 0.70
        target_tss: 72
        description: "Z2 90 min with 2x10 min tempo @ 240-285W in the back half."

  # -------------------------------------------------------------------------
  - name: "Phase 2 — Threshold Build"
    weeks: [8, 13]                 # was [7, 12]; shifted +1wk with Phase 1 extension.
    week_template:
      monday:
        type: Rest
        description: "Rest or easy spin."
      tuesday:
        type: Threshold
        duration_min: 75
        target_watts: "305-320"
        target_if: 0.85
        target_tss: 92
        description: "WU, Threshold reps @ ~100% FTP, CD. RE-ANCHORED 8/28 to the tested FTP 320 (was 290-305 @ FTP 305). VALIDATION RESULT (9/01, read 9/07): 320 CONFIRMED and no longer provisional — the 3x15 ran 319W/HR 168, 319W/HR 175, 314W/HR 175, fade 1.6%, max HR 183, 43.3 min total at 99% FTP. Against the pre-committed gate: rep 3 above the 310W fail line (pass), last-rep HR exactly on the 175 ceiling (pass), fade inside +/-2% (pass); but rep 3 came in 5W under the 318-322 band and was cut short to 13.5 min of 15. So 320 is a CEILING, not the floor the 8/28 note hypothesised — hold the anchor at 320 and do not drift the Tuesday reps above it before the 11/03 test. Next progression here is duration (3x15 -> 3x18 at the same 320W), not watts. UPDATE 9/15: 9/08 re-ran the 3x15 @ 320W and cleaned it up — 319W/319W/319W, all three reps the full 14.9-15.0 min, fade 0.0%, IF 0.912, TSS 91 (vs 9/01's 319/319/314 with rep 3 cut to 13.5 min). The 320 anchor is holding and the duration step is earned; no HR on that file (strap dropout, no decoupling either) so the HR-cost side is unconfirmed. Carry 3x18 @ 320W into the first Phase 4 Tuesday. Progression to date: 8/18 held 2x20 @ 299W/HR 162 + 304W/HR 169, fade -1.7%, EF 1.801 (sub-max 20-min best 305W); 8/20 held 2x20 over-unders at 300W blended (8 overs @ 322W, 0.0% fade), max HR 177 vs 197; 8/27 held 2x20 over-unders at 312W blended (8 overs @ 338W, -0.1% fade), max HR 181, sub-max 20-min best 313W. All clearly submaximal. Fuel per the indoor-threshold rule (main meal 3h out, 60-90 g carb/hr + 500-800 mg sodium/hr on-bike, fan on)."
      wednesday:
        type: Endurance
        duration_min: 75
        target_watts: "205-235"
        target_if: 0.65
        target_tss: 52
        description: "Z2, 75 min."
      thursday:
        type: Threshold
        duration_min: 75
        target_watts: "under 295 / over 336"
        target_if: 0.88
        target_tss: 95
        description: "Over-unders: 2 sets of 4x(3 min under @295W / 2 min over @336W). Trains lactate shuttling. RE-ANCHORED 8/28 to FTP 320 (was 280/320 @ FTP 305) — note this is not a step up in stimulus: on 8/27 the athlete already rode this session at 296W under / 338W over, i.e. within 1-2W of these numbers, self-anchoring to ~322. The old targets are what he had outgrown."
      friday:
        type: Rest
        description: "Full rest."
      saturday:
        type: Endurance
        duration_min: 165
        target_watts: "Z2 205-235, tempo 245-288"
        target_if: 0.71
        target_tss: 135
        description: "Long endurance 2.5-3 hr with 3x12 min tempo. RE-ANCHORED 8/28 to FTP 320 (was Z2 195-225 / tempo 230-275). IMPORTANT: keep riding the tempo blocks at 245-250W — the bottom of the new band — NOT the 288W top. This is a same-power durability series (8/08 @ 249W -> +7 bpm, 8/15 @ 244W -> +2 bpm, 8/22 @ 244W -> -1 bpm) and the number being tracked is block-3 HR minus block-1 HR at held power; changing the power breaks the comparison. The tempo blocks ARE being ridden, correctly — corrected 8/20: 8/08 logged 36.2 min and 8/15 logged 36.2 min in Z3 (232-274W) against a prescribed 36 min. The earlier 'flat Z2, no tempo detectable' note was a detection artifact (tempo sits below the 268W interval threshold, and 36 min at ~250W barely moves VI on a 165-min ride at ~206W) — do not re-derive it from VI or the interval table. Keep riding them as prescribed. Fuel it: 60-90 g carb/hr + 500-800 mg sodium/hr on the bike."
      sunday:
        type: Endurance
        duration_min: 90
        target_watts: "205-235"
        target_if: 0.65
        target_tss: 62
        description: "Z2, 90 min."

  # -------------------------------------------------------------------------
  - name: "Phase 3 — VO2max Block"
    weeks: [14, 17]                # was [13, 16]; shifted +1wk.
    week_template:
      monday:
        type: Rest
        description: "Rest."
      tuesday:
        type: VO2max
        duration_min: 60
        target_watts: "340-368"
        target_if: 0.88
        target_tss: 85
        description: "WU 20 min with 3x1 min openers @ ~340W in the last 8 min, then 4x4 min @ 115% FTP (~368W) w/ 4 min easy between, CD 8 min. OPEN REP 1 AT THE BAND BOTTOM (340W) and build toward 368W across reps 2-4 if HR and RPE allow — do not lead with 368W at an untested intensity. Cadence 90+; dropping cadence at these watts loads the quads instead of the aerobic system. RE-ANCHORED 8/28 to FTP 320 (was 325-350 @ FTP 305). FUELLING (added 9/16, previously only written on the Phase 2 sessions — this block is higher intensity, not lower, so the rule applies at least as much): main meal 3h out, nothing large inside 90 min, 60-90 g carb/hr + 500-800 mg sodium/hr on the bike, fan on. Take on-bike carb in steady small sips from the warmup onward rather than a concentrated slug at the start — 9/15 produced side stitch, which tracks with meal timing and drink concentration rather than with total intake."
      wednesday:
        type: Endurance
        duration_min: 60
        target_watts: "205-235"
        target_if: 0.63
        target_tss: 40
        description: "Easy Z2. Lower volume block — keep this genuinely easy."
      thursday:
        type: VO2max
        duration_min: 60
        target_watts: "362 / 205"
        target_if: 0.86
        target_tss: 80
        description: "WU 20 min with 3x1 min openers @ ~340W in the last 8 min, then 30/15s: 30 sec @ 362W / 15 sec @ 205W x13, 2-3 sets (5 min easy between sets), CD 8 min. START AT 2 SETS and only take the third if set 2 finishes with the last three 30s reps still holding 362W. Cadence 95-100 on the 30s — spin them, don't grind them. RE-ANCHORED 8/28 to FTP 320 (was 345/195 @ FTP 305). FUELLING (added 9/16, previously only written on the Phase 2 sessions): main meal 3h out, nothing large inside 90 min, 60-90 g carb/hr + 500-800 mg sodium/hr on the bike, fan on. Steady small sips from the warmup onward, not a concentrated slug at the start."
      friday:
        type: Rest
        description: "Rest."
      saturday:
        type: Endurance
        duration_min: 165          # RESTORED to 165 on 9/15 — the single-sample gate below did not
                                   # return a usable sample. See the 9/15 resolution at the end of
                                   # this comment block.
                                   # RELEASED to 135 on 9/01 — the gate written here on 8/18 has
                                   # now been met. It was HELD at 165 (was 135) because long-ride
                                   # decoupling was over the 6.0% flag three Saturdays running
                                   # (7/12 6.2% -> 8/08 9.8% -> 8/15 8.0%). The release condition
                                   # was "two consecutive long rides under 6%": 8/22 came in at
                                   # 3.8% and 8/29 at 5.7%. Both under. Gate met, so the hold
                                   # comes off and Phase 3's Saturday returns to its planned 135.
                                   # RE-CHECK: 8/29's 5.7% is only marginally under the line and
                                   # rose from 3.8%. The re-check was written on 9/01 as two more
                                   # long rides before Phase 3 (9/05, 9/12).
                                   # UPDATED 9/07: 9/05 WAS NOT RIDDEN — 9/03-9/06 were four
                                   # consecutive off-bike days, so the Thu over-unders, the Sat
                                   # long ride and the Sun Z2 were all missed. That halves the
                                   # re-check. Sat 9/12 is now the ONLY remaining sample before
                                   # Phase 3 opens on 9/14, so read it as a single-sample gate:
                                   #   - 9/12 decoupling <= 6.0%  -> keep this at 135 / TSS 98.
                                   #   - 9/12 decoupling  > 6.0%  -> restore 165 min / TSS 120.
                                   #   - 9/12 NOT RIDDEN          -> restore 165 min / TSS 120.
                                   # The last case is deliberate: the release rested on two
                                   # samples, one of them marginal (5.7%) and rising, and the
                                   # athlete has now gone a full week without a long ride. With
                                   # no confirming data, default back to the durability-building
                                   # duration rather than assume the limiter stayed resolved.
                                   # RESOLVED 9/15: 9/12 WAS ridden, but as 60.8 min / NP 211W /
                                   # 44 TSS — a short Z2, not the 165-min long ride. Its 4.1%
                                   # decoupling therefore does NOT satisfy branch 1: decoupling
                                   # only becomes a durability reading past ~90 min, and the
                                   # limiter this gate tracks lives in hours 2-3. Read literally
                                   # ("ridden, 4.1% <= 6.0%") the gate would hold 135; read for
                                   # what it was measuring, 9/12 is branch 3 — no confirming
                                   # data — so Saturday goes back to 165 / TSS 120.
                                   # Supporting: the last true long ride is 8/29 (165 min, 5.7%,
                                   # rising from 3.8% on 8/22) — 17 days ago. 9/05 missed, 9/12
                                   # truncated. `review` reports Z2 decoupling "improving,
                                   # recent avg 3.1%", but every ride in that recent window is
                                   # 50-90 min, so the trend is a duration artifact, not a
                                   # durability gain. Do not read it as the missing sample.
                                   # RE-RELEASE CONDITION (unchanged in substance): two
                                   # consecutive Saturdays of >= 120 min with decoupling <= 6.0%
                                   # -> cut back to 135 / TSS 98. Sat 9/19 is sample 1.
        target_watts: "205-235"
        target_if: 0.66
        target_tss: 120            # 165 min @ IF 0.66 (was 98 at 135 min, 9/01-9/15)
        description: "Z2 endurance, 2.75 hr, with 3x12 min tempo @ 245-250W in the back half. RESTORED 165 min / TSS 120 on 9/15 (had been cut to 135 / 98 on 9/01). The 9/01 cut was released on a two-sample durability gate (8/22 3.8%, 8/29 5.7%) and re-checked on a single sample, Sat 9/12. 9/12 came in at 60.8 min / 44 TSS — a short Z2, not a long ride — so its 4.1% decoupling is not a durability reading and the gate returned no usable sample. Last true long ride: 8/29, 17 days before this restore. THE POINT OF THE EXTRA 30 MIN is time past the 2-hour mark, where the limiter actually shows up; if the week has to lose volume, lose it from Sunday, not from here. Keep riding the tempo blocks at 245-250W, NOT the 288W band top — this is a same-power durability series (8/08 @ 249W -> +7 bpm across blocks, 8/15 @ 244W -> +2, 8/22 @ 244W -> -1, 8/29 @ 249W -> 0) and the tracked number is block-3 HR minus block-1 HR at held power; changing the power breaks the comparison. Re-release to 135 / TSS 98 after two consecutive Saturdays of >=120 min with decoupling <=6.0%. Fuel it: 60-90 g carb/hr + 500-800 mg sodium/hr."
      sunday:
        type: Endurance
        duration_min: 75
        target_watts: "205-235"
        target_if: 0.63
        target_tss: 48
        description: "Easy Z2 or rest."

  # -------------------------------------------------------------------------
  - name: "Phase 4 — Consolidation + Peak"
    weeks: [18, 21]                # was [17, 20]; shifted +1wk.
    week_template:
      monday:
        type: Rest
        description: "Rest."
      tuesday:
        type: Threshold
        duration_min: 90
        target_watts: "314-320"
        target_if: 0.86
        target_tss: 110
        description: "Threshold 2x25-30 min @ 98-100% FTP. RE-ANCHORED 8/28 to FTP 320. Re-anchor again after the 11/03 test."
      wednesday:
        type: Endurance
        duration_min: 75
        target_watts: "205-235"
        target_if: 0.65
        target_tss: 52
        description: "Z2, 75 min."
      thursday:
        type: Threshold
        duration_min: 75
        target_watts: "under 295 / over 336+"
        target_if: 0.88
        target_tss: 95
        description: "Over-unders, longer overs. RE-ANCHORED 8/28 to FTP 320 (was 280/320+ @ FTP 305)."
      friday:
        type: Rest
        description: "Full rest."
      saturday:
        type: Endurance
        duration_min: 150
        target_watts: "Z2 + surges to race pace"
        target_if: 0.72
        target_tss: 120
        description: "Endurance with race-pace surges (crit specificity)."
      sunday:
        type: Endurance
        duration_min: 90
        target_watts: "205-235"
        target_if: 0.64
        target_tss: 58
        description: "Easy Z2."

# Date-specific overrides — highest priority per date. Used for tests and for the
# 7/26-8/02 re-entry ramp after the 11-day off-bike gap (7/16-7/26). Retest Tue 8/04.
schedule:
  # -------------------- Re-entry ramp (7/26 → 8/02) --------------------
  2026-07-26:                     # today — was Endurance 90 min w/ 2x10 tempo
    type: Endurance
    duration_min: 60
    target_watts: "200-230"
    target_if: 0.66
    target_tss: 44
    description: "Re-entry ride #1 after 11-day gap. Pure Z2, NO tempo blocks. If HR runs away at 210W or legs empty, cut to 45 min easy spin — don't force it."
  2026-07-27:                     # Mon — Rest (matches Phase 1 Mon but stated explicitly for the log)
    type: Rest
    description: "Rest between re-entry rides #1 and #2. 20-min easy spin is fine if legs feel stiff."
  2026-07-28:                     # was the FTP test date
    type: Endurance
    duration_min: 60
    target_watts: "200-230"
    target_if: 0.66
    target_tss: 44
    description: "Re-entry ride #2. Z2, cadence 90+. FTP retest pushed from today to 8/04 — do NOT test today."
  2026-07-29:                     # SST re-entry, stepped back from 2x20 @ 285W
    type: SweetSpot
    duration_min: 60
    target_watts: "270-280"
    target_if: 0.72
    target_tss: 52
    description: "Re-entry SST: WU 15min, 2x10 min @ 275W (~87% FTP, 3 min easy between), CD. If HR <162 at end of rep 1, take rep 2 to 12 min. Deliberately below the 2x20 @ 285W last done 7/15 — one clean step-back before rebuilding."
  2026-07-30:
    type: Endurance
    duration_min: 60
    target_watts: "200-230"
    target_if: 0.65
    target_tss: 42
    description: "Re-entry Z2, 60 min. Conversational."
  2026-07-31:
    type: Rest
    description: "Full rest."
  2026-08-01:                     # long ride re-entry — 120 min not 180
    type: Endurance
    duration_min: 120
    target_watts: "200-230"
    target_if: 0.66
    target_tss: 87
    description: "Long ride re-entry — 120 min Z2, NO tempo. Fuel well (60-90 g/hr on-bike, ~2 g/kg carbs in the 2 hr pre-ride). Was 180 min — stepped back by an hour."
  2026-08-02:
    type: Endurance
    duration_min: 60
    target_watts: "200-230"
    target_if: 0.65
    target_tss: 42
    description: "Easy Z2 close to re-entry week. Was 90 min w/ tempo — no tempo this week."

  # -------------------- Test day --------------------
  # Test is Tue 8/04, first Tuesday of the new Phase 2 window. One re-entry week
  # (7/27-8/02) is enough to re-sync HR-for-power pattern in a trained cyclist;
  # the underlying adaptations from Phase 1 didn't unwind in 10 days off.
  2026-08-04:                     # was 2026-07-28; pushed +1wk after the gap.
    type: Test
    description: "FTP retest (20-min test x0.95, or ramp). Pushed one week from 7/28 to allow a re-entry week (7/27-8/02) after the 11-day off-bike gap. Re-anchor watt targets after."
  2026-08-25:                     # MOVED UP from 2026-09-08 on 8/20. The pre-committed gate on the
                                  # Thursday over-under fired on all three criteria, so the retest
                                  # comes forward two weeks rather than training on a stale anchor.
    type: Test
    description: "FTP retest (20-min x0.95 preferred over ramp — ramp under-reads for this rider). Moved up from 9/08: the 8/20 over-under passed every gate criterion — full 40 min completed as 2x4x(3/2), overs 8x322W with 0.0% fade, last over HR 175, ride max 177 vs 197 max. Rode it ABOVE prescription (unders 286W vs 280, overs 322W vs 320, blend 300W vs 296) and still finished with 20 bpm of HR headroom. Also set a 40-min best of 283W two days after 8/18's 284W. FTP estimate 315-322 against a 305 anchor; do not train another block on it. Replaces the 9/08 slot entirely — do NOT also test 9/08. Supersedes the Tuesday 3x15 @ 305, which moves to 9/01 at re-anchored watts. Re-anchor Phase 2/3/4 targets after. RESULT (read 8/28): ramp completed, 33.1 min, best 1-min 426W, final ramp step 8:27 @ 352W avg / HR 175, ride max HR 187 vs 197. Zwift ramp FTP = 0.75 x 426 = 320W. Ridden as a ramp rather than the preferred 20-min x0.95, so 320 is provisional — Phase 2/3/4 targets re-anchored to it on 8/28 and the 9/01 3x15 @ 320W is the validation."
  # -------------------- Protecting the 8/25 test --------------------
  2026-08-23:                     # ADDED 8/20. Sunday trimmed 90 -> 60 min purely to freshen for
                                  # the Tuesday test. Saturday stays at 165 min — it is the
                                  # durability session and is not the one to cut.
    type: Endurance
    duration_min: 60
    target_watts: "195-225"
    target_if: 0.65
    target_tss: 42
    description: "Easy Z2, 60 min (trimmed from 90). NOT RIDDEN — 8/23 and 8/24 were both taken off ahead of the test; left at the old FTP-305 watts as a historical record. Freshens Tue 8/25's FTP test: projected TSB +1.4 at 90 min vs +3.2 at 60 min. Genuinely easy — no tempo."
  2026-11-03:                     # was 2026-10-27; final test shifted +1wk with the phases.
    type: Test
    description: "Final FTP test (20-min x0.95 or ramp). Converts the raised ceiling into testable FTP."
