# =============================================================================
# 20-Week Pyramidal FTP Build — encoded from your plan.
#
# Periodized into 4 phases. A date resolves to a workout by:
#   1. an exact-date entry under `schedule:` (FTP tests) — highest priority
#   2. the phase whose week range contains that date -> that phase's weekday
#
# Watt targets below are anchored to FTP 305 (8/04 ramp retest). RE-ANCHOR after each retest:
# update `ftp` in config/athlete.yaml and bump the watt targets in the affected
# phase (or just ask Claude via /training-review to re-anchor them).
#
# Workout fields: type, duration_min, target_watts, target_if, target_tss, description
# Types used: Rest, Recovery, Endurance, SweetSpot, Threshold, VO2max, Test
# =============================================================================

meta:
  name: "20-Week Pyramidal FTP Build"
  goal: "Raise FTP from 315; crit specificity by peak"
  start_date: 2026-06-15        # Monday of Week 1 (you started Tue 6/16)
  ftp_at_start: 315

phases:
  # -------------------------------------------------------------------------
  - name: "Phase 1 — Aerobic Base"
    weeks: [1, 7]                  # was [1, 6]; extended +1wk after 7/16-7/26 gap so
                                   # the re-entry week (W7 = 7/27-8/02, encoded as per-day
                                   # schedule overrides below) sits before the retest on 8/04.
    week_template:
      monday:
        type: Recovery
        duration_min: 30
        target_watts: "<200"
        target_if: 0.50
        description: "Rest, or 30 min easy spin. Genuinely easy."
      tuesday:
        type: Endurance
        duration_min: 90
        target_watts: "200-230"
        target_if: 0.66
        target_tss: 65
        description: "Z2, 75-90 min. Conversational, cadence 90+."
      wednesday:
        type: SweetSpot
        duration_min: 75
        target_watts: "280-295"
        target_if: 0.74            # Calibrated for 2x15 @ 285W with proper WU/CD.
        target_tss: 65             # Bump to IF 0.78 / TSS 72 once you're built to 2x20.
        description: "WU 15min, SST 2x15min @ 285W (3 min easy between), CD. Build toward 2x20."
      thursday:
        type: Endurance
        duration_min: 75
        target_watts: "200-230"
        target_if: 0.65
        target_tss: 52
        description: "Z2, 60-90 min."
      friday:
        type: Rest
        description: "Full rest."
      saturday:
        type: Endurance
        duration_min: 180
        target_watts: "200-230"
        target_if: 0.66
        target_tss: 130
        description: "Long Z2, 2.5-3.5 hr. Biggest aerobic stimulus of the week — fuel well."
      sunday:
        type: Endurance
        duration_min: 90
        target_watts: "Z2 200-230, tempo 240-285"
        target_if: 0.70
        target_tss: 72
        description: "Z2 90 min with 2x10 min tempo @ 240-285W in the back half."

  # -------------------------------------------------------------------------
  - name: "Phase 2 — Threshold Build"
    weeks: [8, 13]                 # was [7, 12]; shifted +1wk with Phase 1 extension.
    week_template:
      monday:
        type: Rest
        description: "Rest or easy spin."
      tuesday:
        type: Threshold
        duration_min: 75
        target_watts: "290-305"
        target_if: 0.85
        target_tss: 92
        description: "WU, Threshold reps @ ~100% FTP, CD. NOTE (8/20): Tue 8/25 is an FTP RETEST, not this session — the 3x15 @ 305W rung moves to 9/01 and must be re-anchored to the tested FTP first (at ~318 it becomes roughly 3x15 @ 318W). Progression to date: 8/18 held 2x20 @ 299W/HR 162 + 304W/HR 169, fade -1.7%, EF 1.801; 8/20 held 2x20 over-unders at 300W blended (8 overs @ 322W, 0.0% fade) with ride max HR 177 vs 197. Both clearly submaximal. Fuel per the indoor-threshold rule (main meal 3h out, 60-90 g carb/hr + 500-800 mg sodium/hr on-bike, fan on)."
      wednesday:
        type: Endurance
        duration_min: 75
        target_watts: "195-225"
        target_if: 0.65
        target_tss: 52
        description: "Z2, 75 min."
      thursday:
        type: Threshold
        duration_min: 75
        target_watts: "under 280 / over 320"
        target_if: 0.88
        target_tss: 95
        description: "Over-unders: 2 sets of 4x(3 min under @280W / 2 min over @320W). Trains lactate shuttling."
      friday:
        type: Rest
        description: "Full rest."
      saturday:
        type: Endurance
        duration_min: 165
        target_watts: "Z2 195-225, tempo 230-275"
        target_if: 0.71
        target_tss: 135
        description: "Long endurance 2.5-3 hr with 3x12 min tempo @ 230-275W. The tempo blocks ARE being ridden, correctly — corrected 8/20: 8/08 logged 36.2 min and 8/15 logged 36.2 min in Z3 (232-274W) against a prescribed 36 min. The earlier 'flat Z2, no tempo detectable' note was a detection artifact (tempo sits below the 268W interval threshold, and 36 min at ~250W barely moves VI on a 165-min ride at ~206W) — do not re-derive it from VI or the interval table. Keep riding them as prescribed. Fuel it: 60-90 g carb/hr + 500-800 mg sodium/hr on the bike."
      sunday:
        type: Endurance
        duration_min: 90
        target_watts: "195-225"
        target_if: 0.65
        target_tss: 62
        description: "Z2, 90 min."

  # -------------------------------------------------------------------------
  - name: "Phase 3 — VO2max Block"
    weeks: [14, 17]                # was [13, 16]; shifted +1wk.
    week_template:
      monday:
        type: Rest
        description: "Rest."
      tuesday:
        type: VO2max
        duration_min: 60
        target_watts: "325-350"
        target_if: 0.88
        target_tss: 85
        description: "WU, 4x4 min @ 115% FTP (~350W) w/ 4 min easy between, CD."
      wednesday:
        type: Endurance
        duration_min: 60
        target_watts: "195-225"
        target_if: 0.63
        target_tss: 40
        description: "Easy Z2. Lower volume block — keep this genuinely easy."
      thursday:
        type: VO2max
        duration_min: 60
        target_watts: "345 / 195"
        target_if: 0.86
        target_tss: 80
        description: "30/15s: 30 sec @ 345W / 15 sec @ 195W x13, 2-3 sets."
      friday:
        type: Rest
        description: "Rest."
      saturday:
        type: Endurance
        duration_min: 165          # HELD at 165 on 8/18 (was 135) — the 8/13 log's pre-committed
                                   # rule fired: 8/15 long-ride decoupling came in at 8.0%, still
                                   # above the 6.0% flag and the 3rd straight Saturday over it
                                   # (7/12 6.2% -> 8/08 9.8% -> 8/15 8.0%). Durability is the
                                   # standing limiter, so the VO2 block does not get to shrink
                                   # the one session that treats it.
        target_watts: "195-225"
        target_if: 0.66
        target_tss: 120
        description: "Z2 endurance, 2.5-2.75 hr. Held at 165 min (not cut to 135) while long-ride decoupling stays >6% — this is the durability lever. Fuel it: 60-90 g carb/hr + 500-800 mg sodium/hr. Cut to 135 min once two consecutive long rides come in under 6%."
      sunday:
        type: Endurance
        duration_min: 75
        target_watts: "195-225"
        target_if: 0.63
        target_tss: 48
        description: "Easy Z2 or rest."

  # -------------------------------------------------------------------------
  - name: "Phase 4 — Consolidation + Peak"
    weeks: [18, 21]                # was [17, 20]; shifted +1wk.
    week_template:
      monday:
        type: Rest
        description: "Rest."
      tuesday:
        type: Threshold
        duration_min: 90
        target_watts: "98-100% FTP (re-anchor)"
        target_if: 0.86
        target_tss: 110
        description: "Threshold 2x25-30 min @ 98-100% FTP. Re-anchor to current FTP."
      wednesday:
        type: Endurance
        duration_min: 75
        target_watts: "195-225"
        target_if: 0.65
        target_tss: 52
        description: "Z2, 75 min."
      thursday:
        type: Threshold
        duration_min: 75
        target_watts: "under 280 / over 320+"
        target_if: 0.88
        target_tss: 95
        description: "Over-unders, longer overs."
      friday:
        type: Rest
        description: "Full rest."
      saturday:
        type: Endurance
        duration_min: 150
        target_watts: "Z2 + surges to race pace"
        target_if: 0.72
        target_tss: 120
        description: "Endurance with race-pace surges (crit specificity)."
      sunday:
        type: Endurance
        duration_min: 90
        target_watts: "195-225"
        target_if: 0.64
        target_tss: 58
        description: "Easy Z2."

# Date-specific overrides — highest priority per date. Used for tests and for the
# 7/26-8/02 re-entry ramp after the 11-day off-bike gap (7/16-7/26). Retest Tue 8/04.
schedule:
  # -------------------- Re-entry ramp (7/26 → 8/02) --------------------
  2026-07-26:                     # today — was Endurance 90 min w/ 2x10 tempo
    type: Endurance
    duration_min: 60
    target_watts: "200-230"
    target_if: 0.66
    target_tss: 44
    description: "Re-entry ride #1 after 11-day gap. Pure Z2, NO tempo blocks. If HR runs away at 210W or legs empty, cut to 45 min easy spin — don't force it."
  2026-07-27:                     # Mon — Rest (matches Phase 1 Mon but stated explicitly for the log)
    type: Rest
    description: "Rest between re-entry rides #1 and #2. 20-min easy spin is fine if legs feel stiff."
  2026-07-28:                     # was the FTP test date
    type: Endurance
    duration_min: 60
    target_watts: "200-230"
    target_if: 0.66
    target_tss: 44
    description: "Re-entry ride #2. Z2, cadence 90+. FTP retest pushed from today to 8/04 — do NOT test today."
  2026-07-29:                     # SST re-entry, stepped back from 2x20 @ 285W
    type: SweetSpot
    duration_min: 60
    target_watts: "270-280"
    target_if: 0.72
    target_tss: 52
    description: "Re-entry SST: WU 15min, 2x10 min @ 275W (~87% FTP, 3 min easy between), CD. If HR <162 at end of rep 1, take rep 2 to 12 min. Deliberately below the 2x20 @ 285W last done 7/15 — one clean step-back before rebuilding."
  2026-07-30:
    type: Endurance
    duration_min: 60
    target_watts: "200-230"
    target_if: 0.65
    target_tss: 42
    description: "Re-entry Z2, 60 min. Conversational."
  2026-07-31:
    type: Rest
    description: "Full rest."
  2026-08-01:                     # long ride re-entry — 120 min not 180
    type: Endurance
    duration_min: 120
    target_watts: "200-230"
    target_if: 0.66
    target_tss: 87
    description: "Long ride re-entry — 120 min Z2, NO tempo. Fuel well (60-90 g/hr on-bike, ~2 g/kg carbs in the 2 hr pre-ride). Was 180 min — stepped back by an hour."
  2026-08-02:
    type: Endurance
    duration_min: 60
    target_watts: "200-230"
    target_if: 0.65
    target_tss: 42
    description: "Easy Z2 close to re-entry week. Was 90 min w/ tempo — no tempo this week."

  # -------------------- Test day --------------------
  # Test is Tue 8/04, first Tuesday of the new Phase 2 window. One re-entry week
  # (7/27-8/02) is enough to re-sync HR-for-power pattern in a trained cyclist;
  # the underlying adaptations from Phase 1 didn't unwind in 10 days off.
  2026-08-04:                     # was 2026-07-28; pushed +1wk after the gap.
    type: Test
    description: "FTP retest (20-min test x0.95, or ramp). Pushed one week from 7/28 to allow a re-entry week (7/27-8/02) after the 11-day off-bike gap. Re-anchor watt targets after."
  2026-08-25:                     # MOVED UP from 2026-09-08 on 8/20. The pre-committed gate on the
                                  # Thursday over-under fired on all three criteria, so the retest
                                  # comes forward two weeks rather than training on a stale anchor.
    type: Test
    description: "FTP retest — RAMP, athlete's choice 8/22. The earlier 'ramp under-reads for this rider' note is RETRACTED: it rested only on 8/04's 317 -> 305, which the 11-day layoff explains on its own, and the 8/04 ramp file corroborates its own result (final 433 s averaged 340W to failure at HR 192 — a ~7-min max of 340W implies FTP ~309 on that day). Ramp is also the better apples-to-apples read here: 8/04 was a ramp on this same platform, so ramp-vs-ramp cancels protocol bias entirely, and it removes the pacing risk a first max 20-min carries for a rider who has trained all block to prescription. VALIDITY GATE — the result only counts if peak HR >= 190 (8/04 hit 192); stopping short of that means the test ended early, not that fitness is flat. Record best 1-min power and the final-7-min average and compare to 8/04's 340W — those compare cleanly even if the printed FTP does not. If the printed number lands under 310, treat it as suspect and validate on 9/01's 3x15 before re-anchoring: 8/18 held 2x20 @ 299W/HR 162 and 304W/HR 169 (86% of max HR), which is not compatible with a sub-310 FTP. Moved up from 9/08: the 8/20 over-under passed every gate criterion — full 40 min completed as 2x4x(3/2), overs 8x322W with 0.0% fade, last over HR 175, ride max 177 vs 197 max. Rode it ABOVE prescription (unders 286W vs 280, overs 322W vs 320, blend 300W vs 296) and still finished with 20 bpm of HR headroom. Also set a 40-min best of 283W two days after 8/18's 284W. FTP estimate 315-322 against a 305 anchor; do not train another block on it. Replaces the 9/08 slot entirely — do NOT also test 9/08. Supersedes the Tuesday 3x15 @ 305, which moves to 9/01 at re-anchored watts. Re-anchor Phase 2/3/4 targets after."
  # -------------------- Protecting the 8/25 test --------------------
  2026-08-23:                     # ADDED 8/20. Sunday trimmed 90 -> 60 min purely to freshen for
                                  # the Tuesday test. Saturday stays at 165 min — it is the
                                  # durability session and is not the one to cut.
    type: Endurance
    duration_min: 60
    target_watts: "195-225"
    target_if: 0.65
    target_tss: 42
    description: "Easy Z2, 60 min (trimmed from 90). Freshens Tue 8/25's FTP test: projected TSB +1.4 at 90 min vs +3.2 at 60 min. Genuinely easy — no tempo."
  2026-11-03:                     # was 2026-10-27; final test shifted +1wk with the phases.
    type: Test
    description: "Final FTP test (20-min x0.95 or ramp). Converts the raised ceiling into testable FTP."
